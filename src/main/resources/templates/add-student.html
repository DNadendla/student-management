<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Add Student | Student Management</title>

  <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
        min-height: 100vh;

        background:
            linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #e0f2fe 100%);

        display: flex;
        justify-content: center;
        align-items: center;

        color: #1e293b;
    }

    .page {
        width: 100%;
        max-width: 520px;
        padding: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.95);

        padding: 40px;

        border-radius: 20px;

        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.12);

        border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .header {
        text-align: center;
        margin-bottom: 32px;
    }

    .icon {
        width: 60px;
        height: 60px;

        margin: 0 auto 16px;

        border-radius: 16px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(135deg, #4f46e5, #7c3aed);

        color: white;

        font-size: 28px;

        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
    }

    .header h1 {
        font-size: 28px;
        font-weight: 700;

        margin-bottom: 8px;

        color: #0f172a;
    }

    .header p {
        font-size: 14px;
        color: #64748b;
    }

    .form-group {
        margin-bottom: 22px;
    }

    label {
        display: block;

        font-size: 14px;
        font-weight: 600;

        margin-bottom: 8px;

        color: #334155;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;

        left: 15px;
        top: 50%;

        transform: translateY(-50%);

        color: #94a3b8;

        font-size: 16px;
    }

    input {
        width: 100%;

        padding: 13px 15px 13px 42px;

        border: 1px solid #cbd5e1;

        border-radius: 10px;

        font-size: 15px;

        outline: none;

        background: #f8fafc;

        transition: all 0.2s ease;
    }

    input::placeholder {
        color: #94a3b8;
    }

    input:focus {
        background: white;

        border-color: #6366f1;

        box-shadow:
            0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    .buttons {
        display: flex;

        gap: 12px;

        margin-top: 30px;
    }

    button,
    .cancel-btn {
        flex: 1;

        padding: 13px 20px;

        border-radius: 10px;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        text-align: center;

        text-decoration: none;

        transition: all 0.2s ease;
    }

    .save-btn {
        border: none;

        color: white;

        background: linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

        box-shadow:
            0 8px 18px rgba(79, 70, 229, 0.25);
    }

    .save-btn:hover {
        transform: translateY(-1px);

        box-shadow:
            0 12px 22px rgba(79, 70, 229, 0.32);
    }

    .cancel-btn {
        border: 1px solid #cbd5e1;

        background: white;

        color: #475569;
    }

    .cancel-btn:hover {
        background: #f8fafc;

        border-color: #94a3b8;
    }

    .footer {
        text-align: center;

        margin-top: 25px;

        font-size: 12px;

        color: #94a3b8;
    }

    @media (max-width: 600px) {

        .card {
            padding: 28px 22px;
        }

        .header h1 {
            font-size: 24px;
        }

    }

</style>
  

</head>

<body>

<div class="page">

  
  <div class="card">

    <!-- Header -->

    <div class="header">

      <div class="icon">
        🎓
      </div>

      <h1>Add Student</h1>

      <p>
        Enter the student's details below
      </p>

    </div>


    <!-- Form -->

    <form th:action="@{/students/save}"
          th:object="${student}"
          method="post">


      <!-- Name -->

      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

          <input
                  type="text"
                  id="name"
                  th:field="*{name}"
                  placeholder="Enter student's name"
                  required>

        </div>

      </div>


      <!-- Email -->

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <div class="input-wrapper">

                <span class="input-icon">
                    ✉
                </span>

          <input
                  type="email"
                  id="email"
                  th:field="*{email}"
                  placeholder="student@example.com"
                  required>

        </div>

      </div>


      <!-- Age -->

      <div class="form-group">

        <label for="age">
          Age
        </label>

        <div class="input-wrapper">

                <span class="input-icon">
                    🎂
                </span>

          <input
                  type="number"
                  id="age"
                  th:field="*{age}"
                  placeholder="Enter age"
                  min="1"
                  max="100"
                  required>

        </div>

      </div>


      <!-- Buttons -->

      <div class="buttons">

        <a
                href="/students"
                class="cancel-btn">
          Cancel
        </a>

        <button
                type="submit"
                class="save-btn">
          Save Student
        </button>

      </div>

    </form>


    <div class="footer">
      Student Management System
    </div>

  </div>
  

</div>

</body>

</html>
