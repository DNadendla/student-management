<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Edit Student | Student Management</title>

  <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff 0%,
                    #f8fafc 50%,
                    #e0f2fe 100%
                );

            display: flex;

            justify-content: center;

            align-items: center;

            color: #1e293b;
        }

        .page {
            width: 100%;

            max-width: 520px;

            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .header {
            text-align: center;

            margin-bottom: 32px;
        }

        .icon {
            width: 60px;

            height: 60px;

            margin: 0 auto 16px;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-size: 28px;

            box-shadow:
                0 10px 20px rgba(79, 70, 229, 0.25);
        }

        .header h1 {
            font-size: 28px;

            font-weight: 700;

            margin-bottom: 8px;

            color: #0f172a;
        }

        .header p {
            font-size: 14px;

            color: #64748b;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #334155;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            background: #f8fafc;

            transition: all 0.2s ease;
        }

        input:focus {
            background: white;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        button,
        .cancel-btn {
            flex: 1;

            padding: 13px 20px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            text-align: center;

            text-decoration: none;
        }

        .save-btn {
            border: none;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );
        }

        .cancel-btn {
            border: 1px solid #cbd5e1;

            background: white;

            color: #475569;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #94a3b8;
        }

    </style>

</head>

<body>

<div class="page">

  <div class="card">

    <div class="header">

      <div class="icon">
        ✏️
      </div>

      <h1>Edit Student</h1>

      <p>
        Update the student's information
      </p>

    </div>


    <form
            th:action="@{/students/update}"
            th:object="${student}"
            method="post">


      <!-- IMPORTANT: Keep the ID -->

      <input
              type="hidden"
              th:field="*{id}">


      <div class="form-group">

        <label for="name">
          Full Name
        </label>

        <input
                type="text"
                id="name"
                th:field="*{name}"
                placeholder="Enter student's name"
                required>

      </div>


      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="student@example.com"
                required>

      </div>


      <div class="form-group">

        <label for="age">
          Age
        </label>

        <input
                type="number"
                id="age"
                th:field="*{age}"
                min="1"
                max="100"
                placeholder="Enter age"
                required>

      </div>


      <div class="buttons">

        <a
                href="/students"
                class="cancel-btn">

          Cancel

        </a>

        <button
                type="submit"
                class="save-btn">

          Update Student

        </button>

      </div>

    </form>


    <div class="footer">

      Student Management System

    </div>

  </div>

</div>

</body>

</html>
