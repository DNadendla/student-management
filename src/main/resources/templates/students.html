<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | Student Management</title>

    <style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;

        min-height: 100vh;

        background:
            linear-gradient(
                135deg,
                #eef2ff 0%,
                #f8fafc 50%,
                #e0f2fe 100%
            );

        color: #1e293b;
    }

    /* Main container */

    .page {
        max-width: 1200px;

        margin: 0 auto;

        padding: 40px 25px;
    }

    /* Header */

    .header {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 30px;
    }

    .title-section h1 {
        font-size: 32px;

        font-weight: 700;

        color: #0f172a;

        margin-bottom: 6px;
    }

    .title-section p {
        color: #64748b;

        font-size: 14px;
    }

    /* Add button */

    .add-button {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 12px 18px;

        background: linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

        color: white;

        text-decoration: none;

        border-radius: 10px;

        font-size: 14px;

        font-weight: 600;

        box-shadow:
            0 8px 18px rgba(79, 70, 229, 0.25);

        transition: all 0.2s ease;
    }

    .add-button:hover {
        transform: translateY(-2px);

        box-shadow:
            0 12px 24px rgba(79, 70, 229, 0.32);
    }

    /* Stats */

    .stats {
        display: flex;

        gap: 20px;

        margin-bottom: 25px;
    }

    .stat-card {
        background: rgba(255, 255, 255, 0.9);

        padding: 20px 25px;

        border-radius: 15px;

        box-shadow:
            0 10px 30px rgba(15, 23, 42, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.8);

        min-width: 180px;
    }

    .stat-label {
        color: #64748b;

        font-size: 13px;

        margin-bottom: 5px;
    }

    .stat-value {
        font-size: 28px;

        font-weight: 700;

        color: #4f46e5;
    }

    /* Table card */

    .table-card {
        background: rgba(255, 255, 255, 0.95);

        border-radius: 18px;

        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.10);

        border: 1px solid rgba(255, 255, 255, 0.8);

        overflow: hidden;
    }

    /* Table header */

    .table-header {
        display: flex;

        justify-content: space-between;

        align-items: center;

        padding: 22px 25px;

        border-bottom: 1px solid #e2e8f0;
    }

    .table-title {
        font-size: 18px;

        font-weight: 600;

        color: #0f172a;
    }

    /* Search */

    .search-box {
        position: relative;
    }

    .search-box input {
        width: 230px;

        padding: 10px 14px 10px 38px;

        border: 1px solid #cbd5e1;

        border-radius: 9px;

        outline: none;

        font-size: 13px;

        background: #f8fafc;
    }

    .search-box input:focus {
        background: white;

        border-color: #6366f1;

        box-shadow:
            0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .search-icon {
        position: absolute;

        left: 13px;

        top: 50%;

        transform: translateY(-50%);

        color: #94a3b8;
    }

    /* Table */

    .table-container {
        overflow-x: auto;
    }

    table {
        width: 100%;

        border-collapse: collapse;
    }

    thead {
        background: #f8fafc;
    }

    th {
        padding: 15px 25px;

        text-align: left;

        font-size: 12px;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: 0.5px;

        color: #64748b;
    }

    td {
        padding: 17px 25px;

        border-top: 1px solid #f1f5f9;

        font-size: 14px;

        color: #334155;
    }

    tbody tr {
        transition: background 0.2s ease;
    }

    tbody tr:hover {
        background: #f8fafc;
    }

    /* Student */

    .student-info {
        display: flex;

        align-items: center;

        gap: 12px;
    }

    .avatar {
        width: 40px;

        height: 40px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        color: white;

        font-size: 14px;

        font-weight: 600;
    }

    .student-name {
        font-weight: 600;

        color: #1e293b;
    }

    .email {
        color: #64748b;
    }

    /* ID */

    .student-id {
        color: #64748b;

        font-weight: 500;
    }

    /* Age badge */

    .age-badge {
        display: inline-block;

        padding: 5px 10px;

        border-radius: 20px;

        background: #eef2ff;

        color: #4f46e5;

        font-size: 12px;

        font-weight: 600;
    }

    /* Actions */

    .actions {
        display: flex;

        gap: 8px;
    }

    .action-btn {
        padding: 7px 12px;

        border-radius: 7px;

        text-decoration: none;

        font-size: 12px;

        font-weight: 600;

        transition: all 0.2s ease;
    }

    .edit {
        background: #eef2ff;

        color: #4f46e5;
    }

    .edit:hover {
        background: #e0e7ff;
    }

    .delete {
        background: #fef2f2;

        color: #dc2626;
    }

    .delete:hover {
        background: #fee2e2;
    }

    /* Empty state */

    .empty-state {
        text-align: center;

        padding: 60px 20px;

        color: #64748b;
    }

    .empty-icon {
        font-size: 45px;

        margin-bottom: 15px;
    }

    .empty-state h3 {
        color: #334155;

        margin-bottom: 7px;
    }

    .empty-state p {
        font-size: 14px;
    }

    /* Footer */

    .footer {
        text-align: center;

        margin-top: 25px;

        font-size: 12px;

        color: #94a3b8;
    }

    /* Mobile */

    @media (max-width: 700px) {

        .page {
            padding: 25px 15px;
        }

        .header {
            flex-direction: column;

            align-items: flex-start;

            gap: 20px;
        }

        .add-button {
            width: 100%;

            justify-content: center;
        }

        .stats {
            flex-direction: column;
        }

        .stat-card {
            width: 100%;
        }

        .table-header {
            flex-direction: column;

            align-items: flex-start;

            gap: 15px;
        }

        .search-box,
        .search-box input {
            width: 100%;
        }

        .search-box {
            width: 100%;
        }

    }

</style>
    

</head>

<body>

<div class="page">

    
    <!-- Header -->

    <div class="header">

        <div class="title-section">

            <h1>Student Management</h1>

            <p>
                Manage your students and their information
            </p>

        </div>

        <a
                class="add-button"
                href="/students/new">

            <span>＋</span>

            Add Student

        </a>

    </div>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Students
            </div>

            <div
                    class="stat-value"
                    th:text="${#lists.size(students)}">
                0
            </div>

        </div>

    </div>


    <!-- Table Card -->

    <div class="table-card">

        <div class="table-header">

            <div class="table-title">
                All Students
            </div>

            <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

                <input
                        type="text"
                        id="searchInput"
                        placeholder="Search students..."
                        onkeyup="searchStudents()">

            </div>

        </div>


        <!-- Table -->

        <div class="table-container">

            <table id="studentTable">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Student</th>

                    <th>Email</th>

                    <th>Age</th>

                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="student : ${students}">

                    <!-- ID -->

                    <td>

                    <span
                            class="student-id"
                            th:text="'#' + ${student.id}">
                        #1
                    </span>

                    </td>


                    <!-- Student -->

                    <td>

                        <div class="student-info">

                            <div
                                    class="avatar"
                                    th:text="${#strings.substring(student.name,0,1).toUpperCase()}">
                                D
                            </div>

                            <div>

                                <div
                                        class="student-name"
                                        th:text="${student.name}">
                                    Dattu
                                </div>

                            </div>

                        </div>

                    </td>


                    <!-- Email -->

                    <td>

                    <span
                            class="email"
                            th:text="${student.email}">
                        dattu@example.com
                    </span>

                    </td>


                    <!-- Age -->

                    <td>

                    <span
                            class="age-badge"
                            th:text="${student.age} + ' years'">
                        25 years
                    </span>

                    </td>


                    <!-- Actions -->

                    <td>

                        <div class="actions">

                            <!-- Edit -->

                            <a
                                    class="action-btn edit"
                                    th:href="@{/students/edit/{id}(id=${student.id})}">
                                ✏ Edit
                            </a>


                            <!-- Delete -->

                            <a
                                    class="action-btn delete"
                                    th:href="@{/students/delete/{id}(id=${student.id})}"
                                    onclick="return confirm('Are you sure you want to delete this student?');">
                                🗑 Delete
                            </a>

                        </div>

                    </td>

                </tr>


                <!-- Empty state -->

                <tr th:if="${#lists.isEmpty(students)}">

                    <td colspan="5">

                        <div class="empty-state">

                            <div class="empty-icon">
                                🎓
                            </div>

                            <h3>
                                No students yet
                            </h3>

                            <p>
                                Add your first student to get started.
                            </p>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        Student Management System
    </div>
</div>

<!-- Search JavaScript -->

<script>

    function searchStudents() {

        let input =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();

        let rows =
            document
                .getElementById("studentTable")
                .getElementsByTagName("tbody")[0]
                .getElementsByTagName("tr");

        for (let i = 0; i < rows.length; i++) {

            let rowText =
                rows[i].innerText.toLowerCase();

            if (rowText.includes(input)) {

                rows[i].style.display = "";

            } else {

                rows[i].style.display = "none";

            }

        }

    }

</script>

</body>

</html>
